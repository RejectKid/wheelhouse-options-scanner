name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        run: >-
          node -e "const version = require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== 'v' + version) {
          console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version v' + version);
          process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Stage release bundle
        shell: bash
        run: |
          bundle="Wheelhouse-${GITHUB_REF_NAME}"
          mkdir -p "release/${bundle}"
          cp -R dist server src scripts "release/${bundle}/"
          cp .env.example .gitignore README.md index.html package.json package-lock.json setup-wheelhouse.cmd "release/${bundle}/"
          cp eslint.config.js tsconfig.app.json tsconfig.json vite.config.ts "release/${bundle}/"
          (
            cd release
            zip -qr "../${bundle}.zip" "${bundle}"
            tar -czf "../${bundle}.tar.gz" "${bundle}"
          )
          sha256sum "${bundle}.zip" "${bundle}.tar.gz" > SHA256SUMS.txt

      - name: Upload packaged application
        uses: actions/upload-artifact@v7
        with:
          name: Wheelhouse-${{ github.ref_name }}
          path: |
            Wheelhouse-${{ github.ref_name }}.zip
            Wheelhouse-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "Wheelhouse-${GITHUB_REF_NAME}.zip"
          "Wheelhouse-${GITHUB_REF_NAME}.tar.gz"
          SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Wheelhouse ${GITHUB_REF_NAME}"
